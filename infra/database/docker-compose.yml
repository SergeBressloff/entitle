services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: entitle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: passpass
      POSTGRES_DB: entitle

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d entitle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: